# Model Configuration
model:
  # Base model
  name: "sarvamai/sarvam-1"
  revision: "main"
  
  # Extended vocabulary for audio tokens
  audio_vocab_size: 4096  # SNAC tokens
  original_vocab_size: null  # Auto-detect from model
  
  # Architecture (from Sarvam-1 specs)
  hidden_size: 2048
  intermediate_size: 11008
  num_attention_heads: 16
  num_hidden_layers: 28
  num_key_value_heads: 8
  max_position_embeddings: 8192

# SNAC Audio Codec
audio:
  sample_rate: 24000
  snac_model: "hubertsiuzdak/snac_24khz"
  # Multi-scale hierarchy settings
  coarse_tokens_per_second: 12
  fine_tokens_per_second: 75

# Target Languages
languages:
  - code: "hi"
    name: "Hindi"
    script: "Devanagari"
  - code: "ta"
    name: "Tamil"
    script: "Tamil"
  - code: "te"
    name: "Telugu"
    script: "Telugu"
  - code: "kn"
    name: "Kannada"
    script: "Kannada"

# Training Configuration
training:
  # Stage 1: Alignment
  alignment:
    learning_rate: 1.0e-4
    batch_size: 8
    gradient_accumulation_steps: 4
    max_epochs: 3
    warmup_ratio: 0.1
  
  # Stage 2: SFT with LoRA
  sft:
    learning_rate: 2.0e-5
    batch_size: 4
    gradient_accumulation_steps: 8
    max_epochs: 2
    lora_rank: 64
    lora_alpha: 128
    lora_target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"

# Inference Configuration
inference:
  # Latency targets
  max_ttft_ms: 250  # Time to first token
  max_e2e_latency_ms: 500  # End-to-end
  
  # Quantization
  quantization: "fp8"  # Options: fp16, fp8, int4
  
  # Batching
  max_batch_size: 25
  enable_inflight_batching: true
  
  # VAD (Voice Activity Detection)
  vad:
    aggressiveness: 2  # 0-3, higher = more aggressive
    frame_duration_ms: 30
    padding_duration_ms: 300

# Safety Configuration
safety:
  # Emergency keywords trigger human handoff
  emergency_keywords:
    hi: ["emergency", "इमरजेंसी", "मदद", "एक्सीडेंट", "बेहोश"]
    ta: ["அவசரம்", "விபத்து", "உதவி"]
    te: ["అత్యవసరం", "ప్రమాదం", "సహాయం"]
    kn: ["ತುರ್ತು", "ಅಪಘಾತ", "ಸಹಾಯ"]
  
  # Fallback settings
  confidence_threshold: 0.7
  max_retries: 2
  sip_transfer_endpoint: "sip:nurse@apollo.local"

# Data Sources
data:
  indicvoices:
    hf_dataset: "ai4bharat/IndicVoices"
    subset_languages: ["hi", "ta", "te", "kn"]
    max_hours_per_language: 3000
  
  medical_dialogues:
    output_path: "data/medical_dialogues/"
    num_samples_per_language: 50000
    domains:
      - "cardiology"
      - "orthopedics"
      - "general_medicine"
      - "emergency"
      - "pharmacy"
      - "appointments"
