[project]
name = "apollo-voice-engine"
version = "0.1.0"
description = "Unified speech-to-speech transformer for Indian regional languages"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Apollo AI Team"}
]

dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "transformers>=4.36.0",
    "snac>=1.2.0",
    "accelerate>=0.25.0",
    "datasets>=2.16.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    "peft>=0.7.0",
    "bitsandbytes>=0.42.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "webrtcvad>=2.0.10",
    "aiohttp>=3.9.0",
    "aiortc>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
]
training = [
    "wandb>=0.16.0",
    "tensorboard>=2.15.0",
    "deepspeed>=0.12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apollo_voice_engine*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
