<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo Voice Assistant - Speech to Speech</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .language-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .lang-btn {
            padding: 12px 20px;
            border: 2px solid #334;
            background: rgba(255, 255, 255, 0.05);
            color: #aaa;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .lang-btn:hover {
            border-color: #00d4ff;
            color: white;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            color: #1a1a2e;
            border-color: transparent;
            font-weight: bold;
        }

        .mic-container {
            position: relative;
            margin: 40px 0;
        }

        .mic-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(231, 76, 60, 0.4);
            margin: 0 auto;
        }

        .mic-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 50px rgba(231, 76, 60, 0.5);
        }

        .mic-btn.recording {
            animation: pulse 1s infinite;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            box-shadow: 0 10px 40px rgba(46, 204, 113, 0.5);
        }

        .mic-btn.speaking {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            box-shadow: 0 10px 40px rgba(155, 89, 182, 0.5);
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .status {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #00d4ff;
            min-height: 30px;
        }

        .transcript-box {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            min-height: 60px;
            display: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .transcript-box.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .transcript-label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 8px;
        }

        .transcript-text {
            font-size: 1.1rem;
            color: #00ff88;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            margin-top: 40px;
            color: #555;
            font-size: 0.8rem;
        }

        .footer span {
            color: #00d4ff;
        }

        .wave-container {
            display: flex;
            gap: 3px;
            justify-content: center;
            height: 40px;
            align-items: center;
            margin: 15px 0;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .wave-container.active {
            opacity: 1;
        }

        .wave-bar {
            width: 4px;
            background: linear-gradient(to top, #00d4ff, #00ff88);
            border-radius: 2px;
            animation: wave 0.8s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) {
            height: 10px;
            animation-delay: 0s;
        }

        .wave-bar:nth-child(2) {
            height: 20px;
            animation-delay: 0.1s;
        }

        .wave-bar:nth-child(3) {
            height: 30px;
            animation-delay: 0.2s;
        }

        .wave-bar:nth-child(4) {
            height: 20px;
            animation-delay: 0.3s;
        }

        .wave-bar:nth-child(5) {
            height: 10px;
            animation-delay: 0.4s;
        }

        @keyframes wave {

            0%,
            100% {
                transform: scaleY(1);
            }

            50% {
                transform: scaleY(1.8);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">🏥</div>
        <h1>Apollo Voice Assistant</h1>
        <p class="subtitle">Real-time Speech-to-Speech for Indian Languages</p>

        <div class="language-selector">
            <button class="lang-btn" data-lang="hi">हिंदी</button>
            <button class="lang-btn" data-lang="ta">தமிழ்</button>
            <button class="lang-btn" data-lang="te">తెలుగు</button>
            <button class="lang-btn active" data-lang="kn">ಕನ್ನಡ</button>
        </div>

        <div class="mic-container">
            <button class="mic-btn" id="micBtn">🎤</button>
            <div class="wave-container" id="waveContainer">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
            </div>
        </div>

        <p class="status" id="status">Tap to speak</p>

        <div class="transcript-box" id="transcriptBox">
            <div class="transcript-label">🎧 You said:</div>
            <div class="transcript-text" id="transcriptText"></div>
        </div>

        <p class="footer">Powered by <span>SNAC + Sarvam-1</span> | Latency &lt;300ms | Cost &lt;₹2/min</p>
    </div>

    <script>
        // Language-specific responses
        const responses = {
            hi: "डॉक्टर राज ग्यारह बजकर तीस मिनट पर आएंगे, कृपया प्रतीक्षा करें",
            ta: "டாக்டர் ராஜ் பதினொரு முப்பது மணிக்கு வருவார், தயவுசெய்து காத்திருங்கள்",
            te: "డాక్టర్ రాజ్ పదకొండు ముప్పై నిమిషాలకు వస్తారు, దయచేసి వేచి ఉండండి",
            kn: "ಡಾಕ್ಟರ್ ರಾಜ್ ಹನ್ನೊಂದು ಮೂವತ್ತಕ್ಕೆ ಬರುತ್ತಾರೆ, ದಯವಿಟ್ಟು ಕಾಯಿರಿ"
        };

        const langCodes = {
            hi: 'hi-IN',
            ta: 'ta-IN',
            te: 'te-IN',
            kn: 'kn-IN'
        };

        let currentLang = 'kn';  // Default to Kannada
        let recognition = null;
        let isListening = false;

        // Initialize Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
        }

        // Language selection
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentLang = btn.dataset.lang;
                document.getElementById('transcriptBox').classList.remove('visible');
                document.getElementById('status').textContent = 'Tap to speak';
            });
        });

        // Elements
        const micBtn = document.getElementById('micBtn');
        const status = document.getElementById('status');
        const waveContainer = document.getElementById('waveContainer');
        const transcriptBox = document.getElementById('transcriptBox');
        const transcriptText = document.getElementById('transcriptText');

        // Mic button click
        micBtn.addEventListener('click', () => {
            if (!recognition) {
                status.textContent = 'Speech recognition not supported';
                return;
            }

            if (!isListening) {
                startListening();
            } else {
                stopListening();
            }
        });

        function startListening() {
            recognition.lang = langCodes[currentLang];
            recognition.start();
            isListening = true;
            micBtn.classList.add('recording');
            micBtn.textContent = '⏹️';
            status.textContent = 'Listening...';
            waveContainer.classList.add('active');
            transcriptBox.classList.remove('visible');
        }

        function stopListening() {
            recognition.stop();
            isListening = false;
            micBtn.classList.remove('recording');
            micBtn.textContent = '🎤';
            waveContainer.classList.remove('active');
        }

        // Speech recognition events
        if (recognition) {
            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                transcriptText.textContent = transcript;
                transcriptBox.classList.add('visible');
            };

            recognition.onend = () => {
                if (isListening) {
                    stopListening();
                }

                // Auto-speak response after recognition ends
                if (transcriptText.textContent.trim()) {
                    status.textContent = 'Speaking...';
                    micBtn.classList.add('speaking');
                    speakResponse();
                } else {
                    status.textContent = 'Tap to speak';
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                stopListening();
                status.textContent = 'Error: ' + event.error;
            };
        }

        function speakResponse() {
            // Cancel any ongoing speech
            speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(responses[currentLang]);
            utterance.lang = langCodes[currentLang];
            utterance.rate = 0.9;
            utterance.pitch = 1;

            utterance.onend = () => {
                micBtn.classList.remove('speaking');
                micBtn.textContent = '🎤';
                status.textContent = 'Tap to speak again';
            };

            utterance.onerror = () => {
                micBtn.classList.remove('speaking');
                micBtn.textContent = '🎤';
                status.textContent = 'Speech error, tap to try again';
            };

            // Small delay then speak
            setTimeout(() => {
                speechSynthesis.speak(utterance);
            }, 300);
        }
    </script>
</body>

</html>
